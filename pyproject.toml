[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hantek-scope"
version = "0.1.0.dev0"
description = "Interface amigável e fluida para o osciloscópio USB Hantek 6022BL"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "PySide6>=6.7",
    "pyqtgraph>=0.13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.gui-scripts]
hantek-scope = "hantek_scope.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
